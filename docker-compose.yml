services:
  ai_service:
    build: .
    container_name: ai_service
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    networks:
      - shoponbot_external_shared_net

networks:
  shoponbot_external_shared_net:
    external: true
    name: shoponbot-production-network 